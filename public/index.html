<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Verdadeiro ou Falso</title>
<style>
*{box-sizing:border-box;margin:0}html,body{height:100%}
body{background:radial-gradient(circle at 50% 0,#14204a,#05060d 70%);color:#fff;font-family:system-ui,sans-serif;font-weight:800;display:flex;flex-direction:column;padding:14px;gap:12px;overflow:hidden}
.top{display:flex;justify-content:space-between;align-items:center;font-size:clamp(22px,6vw,34px)}.v{color:#3b82f6}.f{color:#ff2d6f}
.chip{font-size:14px;background:#1b2238;padding:6px 12px;border-radius:10px}
.card{border:2px solid #2a3558;border-radius:22px;padding:18px;background:#0b1022;text-align:center;flex:1;display:flex;flex-direction:column;justify-content:center;gap:10px;position:relative}
.q{font-size:clamp(24px,7vw,40px);line-height:1.15}.res{font-size:clamp(40px,12vw,64px)}
.expl{background:#1b2238;border-radius:14px;padding:12px;font-size:clamp(14px,4vw,20px);font-weight:600}
.timer{width:76px;height:76px;border-radius:50%;border:5px solid #f5c542;font-size:36px;display:flex;align-items:center;justify-content:center;margin:0 auto;background:#0b1022}
.btns{display:flex;gap:12px}.b{flex:1;border-radius:18px;padding:14px;text-align:center;font-size:clamp(20px,6vw,30px)}
.b small{display:block;font-size:14px;opacity:.85;margin-top:4px}.b.v{background:#2563eb;color:#fff}.b.f{background:#ff2d6f;color:#fff}.dim{opacity:.3}
.bar{height:26px;border-radius:14px;overflow:hidden;display:flex;background:#222;border:2px solid #fff;font-size:14px;line-height:22px}
.bar div{transition:width .4s;padding:0 10px;min-width:0}.bv{background:#2563eb}.bf{background:#ff2d6f;text-align:right}
.rank{background:#0b1022;border:2px solid #2a3558;border-radius:16px;padding:10px 14px;font-size:16px}
.rank h4{text-align:center;font-size:13px;letter-spacing:1px;margin-bottom:6px}.rank p{display:flex;justify-content:space-between;padding:3px 0}
#toasts{position:fixed;top:70px;left:50%;transform:translateX(-50%);width:92%;pointer-events:none;z-index:5}
.toast{background:linear-gradient(90deg,#ff2d6f,#f5a742);border-radius:16px;padding:12px;margin-bottom:8px;text-align:center;font-size:20px;animation:pop 3s forwards}
@keyframes pop{0%{transform:scale(.5);opacity:0}10%{transform:scale(1.05);opacity:1}85%{opacity:1}100%{opacity:0;transform:translateY(-20px)}}
.heart{position:fixed;bottom:80px;font-size:28px;animation:up 2.5s forwards;pointer-events:none}
@keyframes up{to{transform:translateY(-55vh);opacity:0}}
.pause{position:fixed;inset:0;background:#000d;display:none;align-items:center;justify-content:center;font-size:34px;z-index:9}
</style></head><body>
<div class="top"><div><span class="v">VERDADEIRO</span> <span style="font-size:.7em">OU</span> <span class="f">FALSO?</span></div><span class="chip" id="likes">♥ 0</span></div>
<div class="card"><div><span class="chip" id="cat">…</span></div>
<div class="q" id="q">Conectando…</div><div class="res" id="res"></div><div class="expl" id="expl" style="display:none"></div>
<div class="timer" id="t">15</div></div>
<div class="btns"><div class="b v" id="bv">VERDADEIRO<small>Digite V</small><small id="cv">0 votos</small></div><div class="b f" id="bf">FALSO<small>Digite F</small><small id="cf">0 votos</small></div></div>
<div class="bar"><div class="bv" id="pv" style="width:50%">50%</div><div class="bf" id="pf" style="width:50%">50%</div></div>
<div class="rank"><h4>RANKING</h4><div id="rk"></div></div>
<div id="toasts"></div><div class="pause" id="pz">⏸ Já voltamos!</div>
<script>
const $=i=>document.getElementById(i);
function toast(m){const d=document.createElement('div');d.className='toast';d.textContent=m;$('toasts').appendChild(d);setTimeout(()=>d.remove(),3000)}
function hearts(n){for(let i=0;i<n;i++){const h=document.createElement('div');h.className='heart';h.textContent='💗';h.style.right=(10+Math.random()*50)+'px';document.body.appendChild(h);setTimeout(()=>h.remove(),2500)}}
const es=new EventSource('/events');
es.addEventListener('fx',e=>{const d=JSON.parse(e.data);if(d.type==='like')hearts(d.n);else toast((d.type==='follow'?'💜 ':'🎁 ')+d.nick+' '+d.msg)});
es.addEventListener('state',e=>{const d=JSON.parse(e.data),r=d.phase==='reveal',a=d.answer;
$('pz').style.display=d.paused?'flex':'none';$('cat').textContent='♡ '+d.cat+' · #'+d.n;$('t').textContent=d.t;$('likes').textContent='♥ '+d.likes;
$('q').style.display=r?'none':'block';$('q').textContent=d.text;
$('res').innerHTML=r?(a==='V'?'<span class=v>VERDADEIRO!</span>':'<span class=f>FALSO!</span>'):'';
$('expl').style.display=r?'block':'none';$('expl').textContent=r?(d.text+' — '+d.expl+' ('+d.correct+' acertaram)'):'';
$('bv').classList.toggle('dim',r&&a!=='V');$('bf').classList.toggle('dim',r&&a!=='F');
const v=d.counts.V,f=d.counts.F,tot=v+f,pv=tot?Math.round(v*100/tot):50;
$('cv').textContent=v+' votos';$('cf').textContent=f+' votos';$('pv').style.width=pv+'%';$('pf').style.width=(100-pv)+'%';$('pv').textContent=pv+'%';$('pf').textContent=(100-pv)+'%';
$('rk').innerHTML=d.rank.map((u,i)=>`<p><span>${i+1} ${u.nick.replace(/</g,'')}</span><span>🔥${u.streak} · ${u.pts} pts</span></p>`).join('')||'<p>Digite V ou F no chat!</p>'});
</script></body></html>
